name: CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: employee_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d employee_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:password@127.0.0.1:5432/employee_management?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: make build

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint protos
        run: buf lint

      - name: Check generated code is up to date
        run: |
          buf generate
          test -z "$(git status --porcelain gen)" || { git status --porcelain gen; exit 1; }

      - name: Check breaking changes
        if: github.ref != 'refs/heads/main'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
