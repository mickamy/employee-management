name: CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: employee_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d employee_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Inject .env file
        uses: ./.github/actions/inject-env

      - name: Run migrations
        run: make db-migrate

      - name: Run tests
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Inject .env file
        uses: ./.github/actions/inject-env

      - name: Build binary
        run: make build

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Inject .env file
        uses: ./.github/actions/inject-env

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint protos
        run: buf lint

      - name: Check generated code is up to date
        run: |
          make gen
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
