version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/storage/db/migrate/sql"
    queries: "internal/features/employee/queries/queries.sql"
    gen:
      go:
        package: "queries"
        out: "internal/features/employee/queries"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "date"
            go_type: "time.Time"
